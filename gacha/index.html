<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>GiftBox v7.0 • Рулетка Telegram NFT, Обмен в 💎 и Колесо Искр</title>
  <meta name="description" content="Рулетка настоящих коллекционных Telegram NFT (Fragment), 10× слот-стенка, Колесо Искр и Созвездия C0–C6!">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    :root{
      --bg:#050711;--card:rgba(14,20,38,.86);--card2:rgba(8,12,24,.96);
      --border:rgba(148,163,184,.20);--spec:rgba(255,255,255,.13);
      --text:#f8fafc;--muted:#94a3b8;
      --accent:#38bdf8;--gold:#facc15;--epic:#c084fc;--green:#34d399;--rose:#fb7185;
      --a1:rgba(56,189,248,.24);--a2:rgba(250,204,21,.18);
    }
    body.theme-star{--a1:rgba(56,189,248,.24);--a2:rgba(192,132,252,.20)}
    body.theme-empire{--a1:rgba(250,204,21,.28);--a2:rgba(244,63,94,.20)}
    body.theme-blindbox{--a1:rgba(192,132,252,.30);--a2:rgba(52,211,153,.22)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;padding:0 11px 92px;min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:
        radial-gradient(660px 360px at 15% -4%,var(--a1),transparent 65%),
        radial-gradient(540px 340px at 92% 10%,var(--a2),transparent 60%),
        var(--bg);
      color:var(--text);overflow-x:hidden;transition:background .35s;
    }
    #fxCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
    .wrap{max-width:500px;margin:0 auto;padding-top:8px}
    .topbar{
      position:sticky;top:0;z-index:45;padding:7px 0 9px;
      background:linear-gradient(180deg,rgba(5,7,17,.98) 76%,rgba(5,7,17,0));
      display:flex;justify-content:space-between;align-items:center;gap:6px;
    }
    .brand{display:flex;align-items:center;gap:7px;min-width:0}
    .brand-ava{
      width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#2563eb,#a855f7);font-size:17px;font-weight:900;flex-shrink:0;
      border:1.5px solid rgba(255,255,255,.24);
    }
    .brand-ava.frame-nebula{border:2px solid #a855f7;box-shadow:0 0 12px rgba(168,85,247,.6)}
    .brand-ava.frame-gold{border:2px solid #facc15;box-shadow:0 0 14px rgba(250,204,21,.6)}
    .brand-meta{min-width:0}
    .brand-name{font-weight:900;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand-sub{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pills{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .pill{
      background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 8px;
      font-size:11px;font-weight:800;display:flex;align-items:center;gap:3px;cursor:pointer;
      backdrop-filter:blur(10px);
    }
    .pill-add{background:linear-gradient(135deg,#2563eb,#6366f1);border-color:rgba(99,102,241,.6)}
    .card{
      background:var(--card);border:1px solid var(--border);border-top-color:var(--spec);
      border-radius:18px;padding:12px;margin-bottom:10px;backdrop-filter:blur(12px);
      box-shadow:0 10px 26px rgba(0,0,0,.38);
    }
    .sub-seg{
      display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card2);
      border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:9px;
    }
    .seg-btn{
      border:none;border-radius:10px;padding:8px 6px;font-weight:900;font-size:12px;cursor:pointer;
      background:transparent;color:var(--muted);transition:.18s;
    }
    .seg-btn.active{
      background:linear-gradient(135deg,rgba(250,204,21,.22),rgba(168,85,247,.22));
      color:#fef08a;box-shadow:0 0 0 1px rgba(250,204,21,.35);
    }
    .banner-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}
    .btab{
      background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:7px 5px;
      cursor:pointer;text-align:center;transition:.16s;color:var(--text);
    }
    .btab.active{border-color:var(--gold);background:linear-gradient(180deg,rgba(250,204,21,.18),rgba(15,21,38,.94));box-shadow:0 0 14px rgba(250,204,21,.2)}
    .btab-t{font-size:10.5px;font-weight:900;line-height:1.15}
    .btab-b{font-size:9px;font-weight:800;color:var(--gold);margin-top:2px}
    .stage{
      position:relative;border-radius:20px;padding:12px;margin-bottom:10px;
      background:linear-gradient(160deg,rgba(22,30,58,.94),rgba(7,10,22,.98));
      border:1.5px solid rgba(250,204,21,.32);box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);
    }
    .stage-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
    .tag{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:999px;background:rgba(56,189,248,.16);color:#7dd3fc;border:1px solid rgba(56,189,248,.3)}
    .tag-gold{background:rgba(250,204,21,.18);color:#fde047;border-color:rgba(250,204,21,.4)}
    .tag-epic{background:rgba(192,132,252,.18);color:#e9d5ff;border-color:rgba(192,132,252,.4)}
    .tag-green{background:rgba(52,211,153,.18);color:#6ee7b7;border-color:rgba(52,211,153,.4)}

    /* ── Casino Case Roulette Viewport ── */
    .roulette-wrap{
      position:relative;border-radius:16px;overflow:hidden;margin:6px 0 10px;padding:10px 0;
      background:radial-gradient(ellipse at center,rgba(250,204,21,.10),rgba(4,6,15,.98) 72%);
      border:1.5px solid rgba(250,204,21,.35);
      box-shadow:inset 0 0 28px rgba(0,0,0,.85),0 0 20px rgba(250,204,21,.14);
      min-height:126px;transition:border-color .2s,box-shadow .2s;
    }
    .roulette-wrap.hot{border-color:#facc15;box-shadow:inset 0 0 28px rgba(0,0,0,.85),0 0 28px rgba(250,204,21,.35)}
    .roulette-wrap::before,.roulette-wrap::after{
      content:"";position:absolute;top:0;bottom:0;width:44px;z-index:8;pointer-events:none;
    }
    .roulette-wrap::before{left:0;background:linear-gradient(90deg,rgba(5,7,17,.96),transparent)}
    .roulette-wrap::after{right:0;background:linear-gradient(270deg,rgba(5,7,17,.96),transparent)}
    .needle-top,.needle-bot{
      position:absolute;left:50%;transform:translateX(-50%);z-index:12;pointer-events:none;
      font-size:13px;color:var(--gold);text-shadow:0 0 10px rgba(250,204,21,.95);
    }
    .needle-top{top:0}
    .needle-bot{bottom:0}
    .needle-line{
      position:absolute;left:50%;top:8px;bottom:8px;width:2px;transform:translateX(-50%);z-index:9;pointer-events:none;
      background:linear-gradient(180deg,rgba(250,204,21,.85),rgba(250,204,21,.22),rgba(250,204,21,.85));
      box-shadow:0 0 10px rgba(250,204,21,.65);
    }
    .reel-track{display:flex;align-items:center;will-change:transform}
    .rtile{
      width:92px;height:102px;margin:0 4px;flex-shrink:0;border-radius:13px;padding:5px 4px;
      background:rgba(13,19,38,.92);border:1.5px solid rgba(148,163,184,.24);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;
      position:relative;transition:transform .2s,box-shadow .2s,border-color .2s;
    }
    .rtile.r5{border-color:rgba(250,204,21,.75);background:linear-gradient(180deg,rgba(250,204,21,.22),rgba(13,19,38,.95));box-shadow:0 0 16px rgba(250,204,21,.24)}
    .rtile.r4{border-color:rgba(192,132,252,.7);background:linear-gradient(180deg,rgba(192,132,252,.18),rgba(13,19,38,.95))}
    .rtile.r3{border-color:rgba(56,189,248,.35)}
    .rtile.winner{transform:scale(1.07);z-index:5;box-shadow:0 0 24px rgba(250,204,21,.65);border-color:#fde047}
    .rtile img{width:54px;height:54px;object-fit:contain}
    .rtile-name{font-size:9px;font-weight:800;line-height:1.1;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rtile-tag{font-size:8px;font-weight:900;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.08)}
    .shake-fx{animation:shakeHard .12s infinite}
    @keyframes shakeHard{0%{transform:translate(0,0) scale(1.07)}25%{transform:translate(-3px,2px) scale(1.09)}50%{transform:translate(3px,-2px) scale(1.08)}75%{transform:translate(-2px,-2px) scale(1.09)}100%{transform:translate(2px,2px) scale(1.07)}}

    /* ── 10x Multi-Reel Slot Wall ── */
    .multi-wall{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 8px}
    .m-slot{
      position:relative;height:56px;border-radius:11px;overflow:hidden;
      background:rgba(7,11,22,.96);border:1.5px solid rgba(148,163,184,.25);
      box-shadow:inset 0 0 14px rgba(0,0,0,.85);
    }
    .m-slot.done-5{border-color:#facc15;box-shadow:0 0 18px rgba(250,204,21,.55)}
    .m-slot.done-4{border-color:#c084fc;box-shadow:0 0 14px rgba(192,132,252,.45)}
    .m-slot::after{content:"▼";position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:8px;color:var(--gold);z-index:6}
    .m-track{display:flex;align-items:center;height:100%;will-change:transform}
    .mtile{
      width:52px;height:46px;margin:0 2px;flex-shrink:0;border-radius:8px;
      background:rgba(15,23,42,.9);border:1px solid rgba(148,163,184,.2);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    .mtile.r5{border-color:#facc15;background:rgba(250,204,21,.22)}
    .mtile.r4{border-color:#c084fc;background:rgba(192,132,252,.18)}
    .mtile img{width:30px;height:30px;object-fit:contain}

    /* ── Pity & Hot Zone ── */
    .pity-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
    .pity-box{background:rgba(6,9,20,.8);border:1px solid var(--border);border-radius:12px;padding:7px 9px}
    .pity-box.hot-pity{border-color:#f59e0b;background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(239,68,68,.12));animation:pulseHot 1.4s infinite}
    @keyframes pulseHot{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4)}50%{box-shadow:0 0 16px 2px rgba(245,158,11,.55)}}
    .pity-row{display:flex;justify-content:space-between;font-size:10px;font-weight:800;margin-bottom:4px}
    .bar{height:6px;border-radius:999px;background:rgba(148,163,184,.16);overflow:hidden}
    .bar>i{display:block;height:100%;border-radius:999px;transition:width .35s}
    .bar-gold>i{background:linear-gradient(90deg,#f59e0b,#fde047)}
    .bar-epic>i{background:linear-gradient(90deg,#9333ea,#e879f9)}
    .bar-green>i{background:linear-gradient(90deg,#10b981,#34d399)}

    /* ── Buttons with sheen ── */
    .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{
      position:relative;overflow:hidden;border:none;border-radius:13px;padding:11px 10px;font-weight:900;font-size:13px;
      cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;transition:.15s;text-align:center;
    }
    .btn-shine::after{
      content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;
      background:linear-gradient(110deg,transparent,rgba(255,255,255,.32),transparent);
      animation:sheen 3.2s infinite;pointer-events:none;
    }
    @keyframes sheen{0%{left:-80%}40%,100%{left:140%}}
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.48;cursor:not-allowed;transform:none}
    .btn-blue{background:linear-gradient(135deg,#2563eb,#4f46e5);box-shadow:0 6px 20px rgba(37,99,235,.4)}
    .btn-gold{background:linear-gradient(135deg,#f59e0b,#eab308);color:#090d16;box-shadow:0 6px 22px rgba(234,179,8,.42)}
    .btn-epic{background:linear-gradient(135deg,#7c3aed,#c026d3)}
    .btn-green{background:linear-gradient(135deg,#059669,#10b981)}
    .btn-ghost{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);font-weight:800;flex-direction:row}
    .btn-sm{padding:6px 9px;font-size:11px;border-radius:10px;flex-direction:row}
    .sub{font-size:10px;opacity:.85;font-weight:700}

    /* ── Neon Wheel ── */
    .wheel-stage{
      position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:12px 6px 6px;margin:4px 0 10px;
    }
    .wheel-rim{
      position:relative;width:274px;height:274px;border-radius:50%;padding:9px;
      background:conic-gradient(from 0deg,#facc15,#a855f7,#38bdf8,#facc15);
      box-shadow:0 0 34px rgba(250,204,21,.28),inset 0 0 16px rgba(0,0,0,.6);
    }
    .wheel-rim-inner{width:100%;height:100%;border-radius:50%;background:#060a18;overflow:hidden;display:flex;align-items:center;justify-content:center}
    #wheelCanvas{width:254px;height:254px;display:block}
    .wheel-ptr{
      position:absolute;top:-2px;left:50%;transform:translateX(-50%);z-index:10;
      font-size:26px;color:#fde047;filter:drop-shadow(0 3px 8px rgba(0,0,0,.9));transition:transform .06s;
    }
    .wheel-ptr.kick{transform:translateX(-50%) rotate(-18deg)}
    .wheel-hub{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;
      background:radial-gradient(circle,#fde047,#d97706);border:3px solid #090d16;
      display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 16px rgba(0,0,0,.7);pointer-events:none;
    }

    /* ── Loot Strip & Rest ── */
    .loot-strip{display:flex;gap:7px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
    .loot-strip::-webkit-scrollbar{display:none}
    .lchip{
      flex-shrink:0;width:74px;border-radius:12px;padding:6px 4px;text-align:center;
      background:var(--card2);border:1px solid var(--border);cursor:pointer;
    }
    .lchip.r5{border-color:rgba(250,204,21,.55)}
    .lchip.r4{border-color:rgba(192,132,252,.45)}
    .lchip img{width:38px;height:38px;object-fit:contain}
    .ticker{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none;margin-bottom:7px}
    .ticker::-webkit-scrollbar{display:none}
    .tchip{flex-shrink:0;font-size:10px;background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.25);border-radius:999px;padding:4px 9px;color:#fef08a;font-weight:700}
    .sec-h{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
    .sec-h h3{margin:0;font-size:13.5px;font-weight:900}
    .squad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}
    .slot{background:var(--card2);border:1px dashed rgba(148,163,184,.35);border-radius:14px;padding:6px 4px;text-align:center;cursor:pointer;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
    .slot.filled{border-style:solid;border-color:rgba(56,189,248,.4)}
    .slot img{width:44px;height:44px;object-fit:contain}
    .slot-name{font-size:9px;font-weight:800;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .slot-rate{font-size:9px;color:var(--gold);font-weight:800}
    .album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .item-card{background:var(--card2);border:1px solid var(--border);border-radius:15px;padding:8px 6px;text-align:center;cursor:pointer;transition:.16s}
    .item-card.r5{border-color:rgba(250,204,21,.55);background:linear-gradient(180deg,rgba(250,204,21,.13),rgba(10,14,26,.95))}
    .item-card.r4{border-color:rgba(192,132,252,.45);background:linear-gradient(180deg,rgba(192,132,252,.11),rgba(10,14,26,.95))}
    .item-card.r3{border-color:rgba(56,189,248,.3)}
    .item-card.locked{opacity:.42;filter:grayscale(.72)}
    .item-card img{width:56px;height:56px;object-fit:contain;margin:4px 0}
    .ic-top{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;font-weight:900}
    .c-badge{background:rgba(250,204,21,.2);color:#fde047;padding:1px 5px;border-radius:6px;font-size:9px}
    .ic-name{font-size:10px;font-weight:800;line-height:1.2;margin-top:2px;min-height:24px}
    .ic-pw{font-size:9px;color:var(--muted);font-weight:700}
    .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:6px}
    .fbtn{border:1px solid var(--border);background:var(--card2);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;flex-shrink:0}
    .fbtn.active{background:rgba(56,189,248,.18);border-color:var(--accent);color:#fff}
    .shop-item,.nft-row,.quest-row,.lb-row{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:9px 10px;background:var(--card2);border:1px solid var(--border);border-radius:14px;margin-bottom:8px}
    .nft-row{border-color:rgba(192,132,252,.38);flex-wrap:wrap}
    .nft-actions{display:flex;gap:6px;align-items:center;margin-left:auto;flex-shrink:0}
    .bp-row{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;align-items:center;padding:7px;background:var(--card2);border:1px solid var(--border);border-radius:12px;margin-bottom:6px}
    .bp-cell{font-size:10.5px;padding:5px 6px;border-radius:9px;background:rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;gap:4px}
    .nav{
      position:fixed;bottom:0;left:0;right:0;z-index:50;
      background:rgba(5,7,17,.97);backdrop-filter:blur(16px);border-top:1px solid var(--border);
      display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .nbtn{background:none;border:none;color:var(--muted);font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 2px}
    .nbtn span.ico{font-size:18px;line-height:1.1}
    .nbtn.active{color:var(--gold)}
    .overlay{position:fixed;inset:0;z-index:80;background:rgba(3,5,14,.86);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:14px}
    .overlay.show{display:flex}
    .modal{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:#0b1124;border:1px solid rgba(250,204,21,.28);border-radius:22px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.8)}
    .reveal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
    .rev-card{border-radius:14px;padding:8px;text-align:center;background:#111a33;border:1.5px solid var(--border);animation:popIn .35s cubic-bezier(.2,1.25,.4,1) both}
    .rev-card.r5{border-color:#facc15;background:linear-gradient(180deg,rgba(250,204,21,.24),#111a33);box-shadow:0 0 22px rgba(250,204,21,.34)}
    .rev-card.r4{border-color:#c084fc;background:linear-gradient(180deg,rgba(192,132,252,.20),#111a33)}
    .rev-card.r3{border-color:rgba(56,189,248,.35)}
    .rev-card img{width:60px;height:60px;object-fit:contain}
    @keyframes popIn{from{opacity:0;transform:scale(.75) translateY(10px)}to{opacity:1;transform:none}}
    .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);z-index:99;background:#0f172a;border:1px solid var(--gold);color:#fff;padding:9px 15px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:10px;color:#fff;font-size:13px}
    .streak-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
    .sday{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:6px 2px;text-align:center;font-size:9.5px;font-weight:800}
    .sday.done{border-color:var(--green);background:rgba(52,211,153,.14);color:#6ee7b7}
    .sday.next{border-color:var(--gold);background:rgba(250,204,21,.16);color:#fde047}
  </style>
</head>
<body class="theme-star">
  <canvas id="fxCanvas"></canvas>
  <div class="wrap">

/* ── Procedural WebAudio Sound Synth (0 external audio files) ── */
const SFX = {
  ctx: null,
  ensure(){
    if(MUTED) return null;
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) this.ctx = new AC();
    }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume().catch(()=>{});
    return this.ctx;
  },
  tone(freq, dur, type='triangle', vol=0.07, delay=0){
    const c=this.ensure(); if(!c) return;
    const t0=c.currentTime+delay;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.01);
  },
  tick(pitch=1){ this.tone(720 + pitch*260, 0.032, 'triangle', 0.055); },
  click(){ this.tone(520, 0.04, 'sine', 0.04); },
  crack(){
    this.tone(180, 0.14, 'sawtooth', 0.11, 0);
    this.tone(920, 0.18, 'square', 0.08, 0.05);
    this.tone(1280, 0.22, 'sawtooth', 0.09, 0.11);
  },
  win3(){ this.tone(523.25,0.14,'triangle',0.06,0); this.tone(659.25,0.18,'triangle',0.07,0.08); },
  win4(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,0.22,'triangle',0.08,i*0.07)); },
  win5(){ [523.25,659.25,783.99,1046.5,1318.5,1567.98].forEach((f,i)=>this.tone(f,0.34,'triangle',0.10,i*0.075)); },
};

function haptic(kind){

    else if(kind==='light'||kind==='medium'||kind==='heavy') tg.HapticFeedback.impactOccurred(kind);
    else if(kind==='success'||kind==='warning') tg.HapticFeedback.notificationOccurred(kind);

}

/* ── Full-Screen Canvas Confetti ── */
const FX = {
  parts: [], raf: null,
  burst(count=90, goldOnly=false){
    const cv=document.getElementById('fxCanvas'); if(!cv) return;
    cv.width=window.innerWidth; cv.height=window.innerHeight;
    const cols=goldOnly?['#facc15','#fde047','#f59e0b','#ffffff']:['#facc15','#c084fc','#38bdf8','#34d399','#fb7185'];
    for(let i=0;i<count;i++){
      const ang = -Math.PI/2 + (Math.random()-0.5)*1.9;
      const spd = 6 + Math.random()*13;
      this.parts.push({
        x: cv.width*(0.2 + Math.random()*0.6), y: cv.height*0.42,
        vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd - 2,
        g: 0.34, sz: 4 + Math.random()*5,
        c: cols[i % cols.length], a: 1, rot: Math.random()*6.28, vr: (Math.random()-0.5)*0.3
      });
    }
    if(!this.raf) this.loop();
  },
  loop(){
    const cv=document.getElementById('fxCanvas'); const ctx=cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);
    this.parts = this.parts.filter(p=>p.a>0.03 && p.y<cv.height+40);
    for(const p of this.parts){
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.a*=0.985;
      ctx.save(); ctx.globalAlpha=p.a; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*0.65); ctx.restore();
    }
    if(this.parts.length) this.raf=requestAnimationFrame(()=>this.loop());
    else this.raf=null;
  }
};

  const d=await r.json().catch(()=>({ok:false,message:'HTTP '+r.status}));
  if(!r.ok || d.ok===false) throw new Error(d.message||'API error');
  return d;
}

function tileHtml(it, extraCls=''){
  const tag = it.is_nft ? (it.stars_rank===5?'★5 NFT':'★4 NFT') : '3★ 3D';
  return `<div class="rtile r${it.stars_rank} ${extraCls}">

    <img src="${it.image_url}" alt="">
    <div class="rtile-name">${esc(itemName(it))}</div>
  </div>`;
}

function getBannerPool(bKey){
  const all = Object.values(CATALOG.items);
  const n5 = all.filter(x=>x.is_nft && x.stars_rank===5);
  const n4 = all.filter(x=>x.is_nft && x.stars_rank===4);
  const c3 = all.filter(x=>!x.is_nft);
  if(bKey==='nft_blindbox') return [...n5, ...n4, ...n4];
  return [...n5, ...n4, ...c3.slice(0,6)];
}

function startIdleBelt(bKey){
  stopIdleBelt();
  const track=document.getElementById('reelTrack');
  if(!track || PULLING) return;
  const pool=getBannerPool(bKey);
  const doubled=[...pool,...pool];
  track.style.transition='none';
  track.innerHTML=doubled.map(it=>tileHtml(it)).join('');
  const halfW = pool.length * 100;
  IDLE_X=0;
  function step(){
    if(PULLING || CUR_TAB!=='wishes' || WISH_MODE!=='roulette') return;
    IDLE_X -= 0.55;
    if(Math.abs(IDLE_X) >= halfW) IDLE_X = 0;
    track.style.transform = `translate3d(${IDLE_X}px,0,0)`;
    IDLE_RAF = requestAnimationFrame(step);
  }
  IDLE_RAF = requestAnimationFrame(step);
}

async function doSpin(bKey, count){

      await runReelSpin(res.results[0]);
    } else {
      await runMultiReelWall(res.results);
    }
    PULLING=false;
    renderAll();
    showResultsModal(res.results);
  }catch(e){
    PULLING=false; renderAll();
    if(e.message.includes('алмазов') || e.message.toLowerCase().includes('crystals')){
      toast(e.message); setTimeout(()=>goTab('shop','stars'), 500);
    } else { toast(e.message); }

}

function runReelSpin(entry){
  return new Promise(resolve=>{
    const stg=document.getElementById('rouletteStage');
    const track=document.getElementById('reelTrack');
    if(!stg || !track || !entry.reel){ resolve(); return; }
    const reel = entry.reel;
    const tiles = [...reel.tiles];
    if(reel.fakeout && reel.fakeout_tile) tiles[reel.winner_index] = reel.fakeout_tile;

    track.style.transition='none';
    track.style.transform='translate3d(0,0,0)';
    track.innerHTML = tiles.map((it,idx)=>tileHtml(it, idx===reel.winner_index?'win-slot-target':'')).join('');

    const pitch = 100; // 92px width + 8px margin
    const winCenter = reel.winner_index * pitch + 50;
    const jitter = (Math.random()-0.5)*22; // land strictly inside winning tile
    const targetX = -(winCenter - stg.clientWidth/2 + jitter);
    const dur = TURBO ? 1250 : 4700;

    let rafTick=null;
    let lastBucket=0;
    const startT=performance.now();
    function tickWatch(){
      if(!PULLING) return;
      const elapsed = performance.now() - startT;
      if(elapsed < dur){
        const style=getComputedStyle(track).transform;
        const m = new DOMMatrixReadOnly(style);
        const bucket = Math.floor(Math.abs(m.m41) / pitch);
        if(bucket !== lastBucket){
          lastBucket = bucket;
          SFX.tick(Math.max(0, 1 - elapsed/dur));
          haptic('sel');
        }
        rafTick = requestAnimationFrame(tickWatch);
      }
    }

    track.getBoundingClientRect();
    track.style.transition = `transform ${dur}ms cubic-bezier(0.06, 0.92, 0.14, 1)`;
    track.style.transform = `translate3d(${targetX}px,0,0)`;
    rafTick = requestAnimationFrame(tickWatch);

    setTimeout(async ()=>{
      if(rafTick) cancelAnimationFrame(rafTick);
      const winEl = track.children[reel.winner_index];
      if(reel.fakeout && winEl){
        SFX.crack(); haptic('heavy');
        winEl.classList.add('winner','shake-fx');
        stg.classList.add('hot');
        await new Promise(r=>setTimeout(r, 850));
        winEl.outerHTML = tileHtml(reel.tiles[reel.winner_index], 'winner');
        FX.burst(130, true); SFX.win5(); haptic('success');
        await new Promise(r=>setTimeout(r, 950));
      } else {
        if(winEl) winEl.classList.add('winner');
        if(entry.stars_rank===5){ FX.burst(120, true); SFX.win5(); haptic('success'); }
        else if(entry.stars_rank===4){ FX.burst(65, false); SFX.win4(); haptic('success'); }
        else { SFX.win3(); haptic('medium'); }
        await new Promise(r=>setTimeout(r, TURBO?300:650));
      }
      resolve();
    }, dur + 60);
  });
}

function runMultiReelWall(results){

    }).join('')}</div>`;

    const maxWait = TURBO ? 1450 : 3800;
    const tickInt = setInterval(()=>{ SFX.tick(0.5); haptic('sel'); }, TURBO ? 110 : 140);
    setTimeout(()=>clearInterval(tickInt), maxWait - 150);

    results.forEach((r,idx)=>{
      const slot = document.getElementById('ms-'+idx);

      const pitch = 56;

      tr.getBoundingClientRect();

      setTimeout(()=>{

    }, maxWait + 450);

function drawWheel(angle){
  const cv=document.getElementById('wheelCanvas');
  if(!cv || !CATALOG || !CATALOG.spark_wheel) return;
  const ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height, cx=W/2, cy=H/2, R=W/2 - 6;
  const secs=CATALOG.spark_wheel.sectors;
  const n=secs.length, slice=(Math.PI*2)/n;
  ctx.clearRect(0,0,W,H);

  for(let i=0;i<n;i++){
    const mid = angle - Math.PI/2 + i*slice;
    const a0 = mid - slice/2, a1 = mid + slice/2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a1); ctx.closePath();
    ctx.fillStyle=secs[i].color; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle='#090d16'; ctx.stroke();

    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(mid);
    ctx.textAlign='right'; ctx.fillStyle='#ffffff';
    ctx.font='bold 24px -apple-system, sans-serif';
    ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=6;
    ctx.fillText(secs[i].label, R - 24, 9);
    ctx.restore();
  }
}

async function spinSparkWheel(){
  if(PULLING) return;
  SFX.ensure(); PULLING=true;
  const btn=document.querySelector('button[onclick="spinSparkWheel()"]');
  if(btn) btn.disabled=true;
  try{
    const res = await api('/api/spark_wheel/spin','POST',{});
    STATE = res;
    const w = res.wheel;
    const secs = CATALOG.spark_wheel.sectors;
    const slice = (Math.PI*2)/secs.length;
    const baseMod = ((Math.PI*2 - (w.sector_index * slice) % (Math.PI*2)) % (Math.PI*2));
    const curMod = ((WHEEL_ANGLE % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    let delta = baseMod - curMod;
    if(delta < 0) delta += Math.PI*2;
    const jitter = (Math.random()-0.5)*(slice*0.58);
    const targetAngle = WHEEL_ANGLE + (TURBO?4:7)*Math.PI*2 + delta + jitter;
    const startAngle = WHEEL_ANGLE;
    const dur = TURBO ? 1400 : 4600;
    const startT = performance.now();
    let lastSlice = Math.floor(startAngle / slice);

    function frame(now){
      const p = Math.min(1, (now - startT)/dur);
      const ease = 1 - Math.pow(1 - p, 5); // easeOutQuint
      WHEEL_ANGLE = startAngle + (targetAngle - startAngle)*ease;
      drawWheel(WHEEL_ANGLE);

      const curSlice = Math.floor(WHEEL_ANGLE / slice);
      if(curSlice !== lastSlice){
        lastSlice = curSlice;
        SFX.tick(1 - p); haptic('sel');
        const ptr=document.getElementById('wheelPtr');
        if(ptr){ ptr.classList.add('kick'); setTimeout(()=>ptr.classList.remove('kick'), 65); }
      }
      if(p < 1){
        requestAnimationFrame(frame);
      } else {
        PULLING=false;
        renderTop();
        if(btn) btn.disabled=false;
        if(w.kind==='nft'){
          FX.burst(130, true); SFX.win5(); haptic('success');
          openModal(`<div style="text-align:center">

          </div>`);
        } else {
          if(w.crystals >= 320){ FX.burst(80); SFX.win4(); haptic('success'); }
          else { SFX.win3(); haptic('medium'); }
          toast(`🎡 Выигрыш Колеса: +${w.crystals} 💎!`);
        }

    }

        ${(ready4.length>0 && ready4.length<ready.length)?`<button class="btn btn-ghost btn-sm" onclick="recycleAllNfts(4)">♻️ 4★ (${ready4.length}) → +${tot4C}💎</button>`:''}

  const nftListHtml = nfts.length ? nfts.map(n=>{
    const it=CATALOG.items[n.item_key];
    const stTag = n.status==='in_collection' ? `<span class="tag tag-green">${t('В наличии · Обмен или вывод','Ready · Swap or Withdraw')}</span>`

    const lockHint = (n.status==='in_collection' && !n.can_withdraw)
      ? `<div class="sub" style="color:var(--gold);margin-top:3px;font-size:9.5px">${t(`Вывод на TON от ${n.withdraw_req_stars} ⭐ покупок · Обмен на 💎 доступен сразу!`,`TON unlock at ${n.withdraw_req_stars} ⭐ purchases · Instant 💎 swap ready!`)}</div>` : '';
    const actions = n.status==='in_collection' ? `<div class="nft-actions">
        <button class="btn btn-green btn-sm btn-shine" onclick="recycleNft(${n.id}, false)">💎 +${n.recycle_crystals} 💎</button>
        <button class="btn btn-ghost btn-sm" onclick="claimNft(${n.id})">📤 ${t('Вывести','TON')}</button>

  const owned=ownedMap();

      ${batchBanner}
      <div style="margin-bottom:10px"><div class="sub" style="margin-bottom:4px;color:var(--muted)">${t('TON-кошелёк для вывода NFT (UQ... / EQ...):','Your TON receiving wallet (UQ... / EQ...):')}</div>
      <div style="display:flex;gap:7px"><input class="input" id="tonAddrInp" value="${esc(u.ton_wallet||'')}" placeholder="UQ..."><button class="btn btn-blue btn-sm" onclick="saveWallet()">${t('Сохранить','Save')}</button></div></div>
      ${nftListHtml}

    <div class="card"><div class="sec-h"><h3>📖 ${t('Астральный Альбом','Astral Album')} (${u.unique_count}/35)</h3><span class="tag tag-gold">⚡ ${u.power_score} CP</span></div>

    <div class="filters">
      <button class="fbtn ${ALBUM_FILTER==='all'?'active':''}" onclick="ALBUM_FILTER='all';renderAll()">${t('Все 35','All 35')}</button>

      <button class="fbtn ${ALBUM_FILTER==='card'?'active':''}" onclick="ALBUM_FILTER='card';renderAll()">✨ 3D (16)</button>
      <button class="fbtn ${ALBUM_FILTER==='owned'?'active':''}" onclick="ALBUM_FILTER='owned';renderAll()">${t('Открыты','Owned')}</button>
      <button class="fbtn ${ALBUM_FILTER==='missing'?'active':''}" onclick="ALBUM_FILTER='missing';renderAll()">${t('Нет','Missing')}</button>
    </div><div class="album-grid">${cards}</div>`;
}

async function recycleNft(invId, keepModal=false, btnId=''){
  try{
    SFX.ensure();
    const res = await api('/api/nft/recycle','POST',{inv_id:invId});
    STATE = res; const rec = res.recycled;
    SFX.win4(); FX.burst(65); haptic('success');
    renderTop();
    if(!keepModal) renderAll();
    else if(btnId){
      const b=document.getElementById(btnId);
      if(b){ b.disabled=true; b.className='btn btn-ghost btn-sm'; b.textContent=`✅ +${rec.crystals}💎`; }
    }
    toast(`💎 +${rec.crystals} 💎 и +${rec.sparks} ✨ зачислены!`);
  }catch(e){ toast(e.message); }
}

}

function renderShop(){
  const u=STATE.user;
  const subTabs=`<div class="btn-row" style="margin-bottom:10px">
    <button class="btn ${SHOP_SUB==='sparks'?'btn-epic':'btn-ghost'} btn-sm" onclick="SHOP_SUB='sparks';renderAll()">✨ ${t('Искры → 💎 Алмазы','Sparks → 💎')}</button>

  </div>`;
  if(SHOP_SUB==='sparks'){
    const boughtMap=STATE.spark_shop_bought||{}; const cosOwned=new Set(STATE.cosmetics||[]);
    const offers=(CATALOG.spark_shop||[]).map(d=>{
      const q=boughtMap[d.key]||0; const isCos=d.kind==='cosmetic';
      const maxOut = isCos ? cosOwned.has(d.cosmetic_key) : (d.monthly_limit>0 && q>=d.monthly_limit);
      const limLbl = isCos ? (maxOut?t('Открыто','Owned'):t('Навсегда','Perm.')) : `${q}/${d.monthly_limit} ${t('в мес.','/mo')}`;
      return `<div class="shop-item"><div><div style="font-weight:900;font-size:13px">${d.emoji} ${esc(lang()==='en'?d.title_en:d.title_ru)} <span class="tag" style="font-size:9px">${limLbl}</span></div>
        <div class="sub" style="color:var(--muted);margin-top:2px">${esc(lang()==='en'?d.desc_en:d.desc_ru)}</div></div>
        <button class="btn ${maxOut?'btn-ghost':'btn-epic'} btn-sm" ${maxOut?'disabled':''} onclick="buySpark('${d.key}')">${maxOut?'✅':`✨ ${d.cost_sparks}`}</button></div>`;
    }).join('');
    return subTabs + `<div class="card"><div class="sec-h"><h3>✨ ${t('Обмен Искр на Алмазы 💎','Convert Sparks to 💎')}</h3><span class="tag tag-gold">✨ ${u.sparks}</span></div>${offers}</div>`;
  }
  const blessCard = u.blessing_days_left > 0
    ? `<div class="card" style="border-color:rgba(56,189,248,.5)"><div class="sec-h"><h3>🌙 ${t('Благословение активно:','Blessing:')} ${u.blessing_days_left} ${t('дн.','d')}</h3>
       ${u.can_claim_blessing ? `<button class="btn btn-blue btn-sm" onclick="claimBlessing()">+90 💎</button>` : `<span class="tag tag-green">✅ ${t('Забрано','Claimed')}</span>`}</div></div>` : '';
  const packs=(CATALOG.packs||[]).map(p=>{
    const oneDone = p.one_time && u.starter_bought; const bpDone = p.is_bp && u.bp_premium; const disabled = oneDone || bpDone;
    const tag = lang()==='en'?p.tag_en:p.tag_ru;
    return `<div class="shop-item" style="${p.featured?'border-color:rgba(250,204,21,.4)':''}"><div><div style="font-weight:900;font-size:13px">${esc(lang()==='en'?p.title_en:p.title_ru)} ${tag?`<span class="tag tag-gold" style="font-size:9px">${esc(tag)}</span>`:''}</div>
      <div class="sub" style="color:var(--muted);margin-top:2px">${esc(lang()==='en'?p.desc_en:p.desc_ru)}</div></div>
      <button class="btn ${disabled?'btn-ghost':'btn-blue'} btn-sm" ${disabled?'disabled':''} onclick="buyPack('${p.key}')">${oneDone||bpDone?'✅':`⭐ ${p.stars}`}</button></div>`;
  }).join('');
  return subTabs + blessCard + `<div class="card"><div class="sec-h"><h3>⭐ ${t('Алмазы Призыва и Пропуска','Diamonds & Passes')}</h3></div>${packs}</div>`;

function renderAll(){
  if(!STATE || !CATALOG) return;
  renderTop();
  const main=document.getElementById('main');
  if(CUR_TAB==='wishes') main.innerHTML=renderWishes();
  else if(CUR_TAB==='squad') main.innerHTML=renderSquad();
  else if(CUR_TAB==='nfts') main.innerHTML=renderNftsAndAlbum();
  else if(CUR_TAB==='shop') main.innerHTML=renderShop();
  else main.innerHTML=renderTopTab();
}

loadAll().catch(e=>{ document.getElementById('topSub').textContent='Ошибка: '+e.message; });
