<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>GiftBox v6 • Коллекционная Гача Telegram NFT</title>
  <meta name="description" content="Выбивай настоящие коллекционные Telegram NFT (Fragment), прокачивай Созвездия C0–C6 и превращай Искры ✨ в Алмазы 💎!">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    :root{
      --bg:#060812;--card:rgba(15,21,38,.84);--card2:rgba(10,14,26,.95);
      --border:rgba(148,163,184,.18);--spec:rgba(255,255,255,.11);
      --text:#f8fafc;--muted:#94a3b8;
      --accent:#38bdf8;--gold:#facc15;--epic:#c084fc;--green:#34d399;--rose:#fb7185;
      --a1:rgba(56,189,248,.22);--a2:rgba(250,204,21,.16);
    }
    body.theme-star{--a1:rgba(56,189,248,.22);--a2:rgba(192,132,252,.18)}
    body.theme-empire{--a1:rgba(250,204,21,.24);--a2:rgba(244,63,94,.18)}
    body.theme-blindbox{--a1:rgba(192,132,252,.26);--a2:rgba(52,211,153,.20)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;padding:0 12px 92px;min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:
        radial-gradient(660px 360px at 15% -4%,var(--a1),transparent 65%),
        radial-gradient(540px 340px at 92% 10%,var(--a2),transparent 60%),
        var(--bg);
      color:var(--text);overflow-x:hidden;transition:background .35s;
    }
    .wrap{max-width:500px;margin:0 auto;padding-top:10px}
    .topbar{
      position:sticky;top:0;z-index:40;padding:8px 0 10px;
      background:linear-gradient(180deg,rgba(6,8,18,.97) 75%,rgba(6,8,18,0));
      display:flex;justify-content:space-between;align-items:center;gap:8px;
    }
    .brand{display:flex;align-items:center;gap:8px;min-width:0}
    .brand-ava{
      width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#2563eb,#a855f7);font-size:18px;font-weight:900;flex-shrink:0;
      border:1.5px solid rgba(255,255,255,.22);
    }
    .brand-ava.frame-nebula{border:2px solid #a855f7;box-shadow:0 0 12px rgba(168,85,247,.55)}
    .brand-ava.frame-gold{border:2px solid #facc15;box-shadow:0 0 14px rgba(250,204,21,.55)}
    .brand-meta{min-width:0}
    .brand-name{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand-sub{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pills{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .pill{
      background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px 9px;
      font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:4px;cursor:pointer;
      backdrop-filter:blur(10px);
    }
    .pill-add{background:linear-gradient(135deg,#2563eb,#6366f1);border-color:rgba(99,102,241,.5)}
    .card{
      background:var(--card);border:1px solid var(--border);border-top-color:var(--spec);
      border-radius:18px;padding:13px;margin-bottom:11px;backdrop-filter:blur(12px);
      box-shadow:0 10px 26px rgba(0,0,0,.35);
    }
    .banner-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
    .btab{
      background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:8px 6px;
      cursor:pointer;text-align:center;transition:.16s;color:var(--text);
    }
    .btab.active{border-color:var(--gold);background:linear-gradient(180deg,rgba(250,204,21,.16),rgba(15,21,38,.92));box-shadow:0 0 0 1px rgba(250,204,21,.3)}
    .btab-t{font-size:11px;font-weight:900;line-height:1.2}
    .btab-b{font-size:9px;font-weight:800;color:var(--gold);margin-top:3px}
    .stage{
      position:relative;border-radius:20px;padding:14px 12px;margin-bottom:10px;overflow:hidden;
      background:linear-gradient(155deg,rgba(20,28,54,.92),rgba(8,12,24,.96));
      border:1px solid rgba(250,204,21,.28);box-shadow:0 14px 36px rgba(0,0,0,.5);
    }
    .stage-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(56,189,248,.16);color:#7dd3fc;border:1px solid rgba(56,189,248,.3)}
    .tag-gold{background:rgba(250,204,21,.16);color:#fde047;border-color:rgba(250,204,21,.35)}
    .tag-epic{background:rgba(192,132,252,.16);color:#e9d5ff;border-color:rgba(192,132,252,.35)}
    .tag-green{background:rgba(52,211,153,.16);color:#6ee7b7;border-color:rgba(52,211,153,.35)}
    .hero-box{display:flex;align-items:center;gap:12px;margin:10px 0 12px}
    .hero-art{
      width:92px;height:92px;border-radius:18px;flex-shrink:0;position:relative;
      background:radial-gradient(circle,rgba(250,204,21,.22),rgba(15,23,42,.9));
      border:1px solid rgba(250,204,21,.4);display:flex;align-items:center;justify-content:center;
      animation:floatY 3.6s ease-in-out infinite;
    }
    @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .hero-art img,.hero-art canvas{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
    .hero-info h2{margin:0 0 4px;font-size:16.5px;font-weight:900}
    .hero-info p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.35}
    .pity-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .pity-box{background:rgba(6,9,20,.75);border:1px solid var(--border);border-radius:12px;padding:7px 9px}
    .pity-row{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;margin-bottom:4px}
    .bar{height:6px;border-radius:999px;background:rgba(148,163,184,.16);overflow:hidden}
    .bar>i{display:block;height:100%;border-radius:999px;transition:width .35s}
    .bar-gold>i{background:linear-gradient(90deg,#f59e0b,#fde047)}
    .bar-epic>i{background:linear-gradient(90deg,#9333ea,#e879f9)}
    .bar-green>i{background:linear-gradient(90deg,#10b981,#34d399)}
    .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{
      border:none;border-radius:13px;padding:11px 10px;font-weight:900;font-size:13px;
      cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;transition:.15s;text-align:center;
    }
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.48;cursor:not-allowed;transform:none}
    .btn-blue{background:linear-gradient(135deg,#2563eb,#4f46e5);box-shadow:0 6px 18px rgba(37,99,235,.35)}
    .btn-gold{background:linear-gradient(135deg,#d97706,#eab308);color:#090d16;box-shadow:0 6px 18px rgba(234,179,8,.35)}
    .btn-epic{background:linear-gradient(135deg,#7c3aed,#c026d3)}
    .btn-green{background:linear-gradient(135deg,#059669,#10b981)}
    .btn-ghost{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);font-weight:800;flex-direction:row}
    .btn-sm{padding:7px 10px;font-size:11.5px;border-radius:10px;flex-direction:row}
    .sub{font-size:10.5px;opacity:.85;font-weight:700}
    .ticker{display:flex;gap:8px;overflow-x:auto;padding:6px 2px;scrollbar-width:none;margin-bottom:8px}
    .ticker::-webkit-scrollbar{display:none}
    .tchip{flex-shrink:0;font-size:10.5px;background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.25);border-radius:999px;padding:4px 9px;color:#fef08a;font-weight:700}
    .sec-h{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
    .sec-h h3{margin:0;font-size:14px;font-weight:900}
    .squad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}
    .slot{
      background:var(--card2);border:1px dashed rgba(148,163,184,.35);border-radius:14px;padding:6px 4px;
      text-align:center;cursor:pointer;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    }
    .slot.filled{border-style:solid;border-color:rgba(56,189,248,.4)}
    .slot img{width:46px;height:46px;object-fit:contain}
    .slot-name{font-size:9.5px;font-weight:800;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .slot-rate{font-size:9px;color:var(--gold);font-weight:800}
    .album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .item-card{
      background:var(--card2);border:1px solid var(--border);border-radius:15px;padding:8px 6px;
      text-align:center;cursor:pointer;position:relative;overflow:hidden;transition:.16s;
    }
    .item-card.r5{border-color:rgba(250,204,21,.55);background:linear-gradient(180deg,rgba(250,204,21,.13),rgba(10,14,26,.95))}
    .item-card.r4{border-color:rgba(192,132,252,.45);background:linear-gradient(180deg,rgba(192,132,252,.11),rgba(10,14,26,.95))}
    .item-card.r3{border-color:rgba(56,189,248,.3)}
    .item-card.locked{opacity:.42;filter:grayscale(.72)}
    .item-card img{width:58px;height:58px;object-fit:contain;margin:4px 0}
    .ic-top{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;font-weight:900}
    .c-badge{background:rgba(250,204,21,.2);color:#fde047;padding:1px 5px;border-radius:6px;font-size:9px}
    .ic-name{font-size:10.5px;font-weight:800;line-height:1.2;margin-top:2px;min-height:25px}
    .ic-pw{font-size:9.5px;color:var(--muted);font-weight:700}
    .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:6px}
    .fbtn{border:1px solid var(--border);background:var(--card2);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;flex-shrink:0}
    .fbtn.active{background:rgba(56,189,248,.18);border-color:var(--accent);color:#fff}
    .shop-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;background:var(--card2);border:1px solid var(--border);border-radius:14px;margin-bottom:8px}
    .nft-row{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:10px;background:var(--card2);border:1px solid rgba(192,132,252,.35);border-radius:14px;margin-bottom:8px}
    .quest-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;background:var(--card2);border:1px solid var(--border);border-radius:13px;margin-bottom:7px}
    .bp-row{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;align-items:center;padding:7px;background:var(--card2);border:1px solid var(--border);border-radius:12px;margin-bottom:6px}
    .bp-cell{font-size:10.5px;padding:5px 6px;border-radius:9px;background:rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;gap:4px}
    .lb-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--card2);border:1px solid var(--border);border-radius:12px;margin-bottom:6px}
    .nav{
      position:fixed;bottom:0;left:0;right:0;z-index:50;
      background:rgba(6,9,20,.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);
      display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .nbtn{background:none;border:none;color:var(--muted);font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 2px}
    .nbtn span.ico{font-size:18px;line-height:1.1}
    .nbtn.active{color:var(--gold)}
    .overlay{position:fixed;inset:0;z-index:80;background:rgba(3,5,14,.84);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:14px}
    .overlay.show{display:flex}
    .modal{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:#0b1124;border:1px solid var(--border);border-radius:22px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.75)}
    .reveal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
    .rev-card{border-radius:14px;padding:8px;text-align:center;background:#111a33;border:1.5px solid var(--border);animation:popIn .35s cubic-bezier(.2,1.25,.4,1) both}
    .rev-card.r5{border-color:#facc15;background:linear-gradient(180deg,rgba(250,204,21,.22),#111a33);box-shadow:0 0 20px rgba(250,204,21,.28)}
    .rev-card.r4{border-color:#c084fc;background:linear-gradient(180deg,rgba(192,132,252,.18),#111a33)}
    .rev-card.r3{border-color:rgba(56,189,248,.35)}
    .rev-card img{width:62px;height:62px;object-fit:contain}
    @keyframes popIn{from{opacity:0;transform:scale(.75) translateY(10px)}to{opacity:1;transform:none}}
    .meteor{height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:18px;background:radial-gradient(circle,rgba(250,204,21,.26),rgba(15,23,42,.92));margin:8px 0;font-weight:900;font-size:15px;text-align:center}
    .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);z-index:99;background:#0f172a;border:1px solid var(--accent);color:#fff;padding:9px 15px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:10px;color:#fff;font-size:13px}
    .streak-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
    .sday{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:6px 2px;text-align:center;font-size:9.5px;font-weight:800}
    .sday.done{border-color:var(--green);background:rgba(52,211,153,.14);color:#6ee7b7}
    .sday.next{border-color:var(--gold);background:rgba(250,204,21,.16);color:#fde047}
  </style>
</head>
<body class="theme-star">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="brand-ava" id="topAva">✨</div>
        <div class="brand-meta">
          <div class="brand-name" id="topName">GiftBox</div>
          <div class="brand-sub" id="topSub">Загрузка коллекции...</div>
        </div>
      </div>
      <div class="pills">
        <div class="pill" onclick="goTab('shop','stars')">💎 <span id="balCrystals">0</span></div>
        <div class="pill" onclick="goTab('shop','sparks')">✨ <span id="balSparks">0</span></div>
        <div class="pill pill-add" onclick="goTab('shop','stars')">+💎</div>
        <div class="pill" onclick="toggleLang()" id="langBtn">RU</div>
      </div>
    </div>

    <div id="welcomeBox"></div>
    <div id="main"></div>
  </div>

  <div class="nav">
    <button class="nbtn active" id="nav-wishes" onclick="goTab('wishes')"><span class="ico">✨</span><span id="nl-wishes">Призывы</span></button>
    <button class="nbtn" id="nav-squad" onclick="goTab('squad')"><span class="ico">🚀</span><span id="nl-squad">Отряд</span></button>
    <button class="nbtn" id="nav-nfts" onclick="goTab('nfts')"><span class="ico">🎨</span><span id="nl-nfts">Мои NFT</span></button>
    <button class="nbtn" id="nav-shop" onclick="goTab('shop')"><span class="ico">🔮</span><span id="nl-shop">Лавка</span></button>
    <button class="nbtn" id="nav-top" onclick="goTab('top')"><span class="ico">🏆</span><span id="nl-top">Топ</span></button>
  </div>

  <div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalBody"></div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

let API_BASE = new URLSearchParams(location.search).get('api') || 'https://201-8-70-200.sslip.io';
let STATE = null;
let CATALOG = null;
let CUR_TAB = 'wishes';
let CUR_BANNER = 'star_banner';
let SHOP_SUB = 'sparks';
let ALBUM_FILTER = 'all';
let PULLING = false;
let BOARD = [];
let HERO_LOTTIE = null;
let MODAL_LOTTIE = null;

const qp = new URLSearchParams(location.search);
if (qp.get('tab')) CUR_TAB = qp.get('tab');
if (qp.get('banner')) CUR_BANNER = qp.get('banner');

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function lang(){return (STATE && STATE.user && STATE.user.lang==='en')?'en':'ru'}
function t(ru,en){return lang()==='en'?en:ru}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(window._tT); window._tT=setTimeout(()=>el.classList.remove('show'),3200);
}
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('overlay').classList.add('show')}
function closeModal(){
  if(MODAL_LOTTIE){try{MODAL_LOTTIE.destroy()}catch(e){} MODAL_LOTTIE=null;}
  document.getElementById('overlay').classList.remove('show');
}

async function api(path, method='GET', body=null){
  const headers={'X-Telegram-Init-Data': tg ? (tg.initData||'') : ''};
  const opts={method,headers};
  if(body!==null){headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
  const r=await fetch(API_BASE+path,opts);
  const d=await r.json().catch(()=>({ok:false,message:'HTTP '+r.status}));
  if(!r.ok || d.ok===false) throw new Error(d.message||'API error');
  return d;
}

function ownedMap(){
  const m={};
  if(STATE && STATE.collection){ STATE.collection.forEach(x=>m[x.item_key]=x); }
  return m;
}
function fmtLeft(sec){
  sec=Math.max(0,Math.floor(sec));
  const d=Math.floor(sec/86400), h=Math.floor((sec%86400)/3600), m=Math.floor((sec%3600)/60);
  if(d>0) return `${d}д ${h}ч`;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function itemName(it){return lang()==='en'?it.name_en:it.name_ru}
function starBadges(n){return n===5?'★★★★★':(n===4?'★★★★':'★★★')}

async function loadAll(){
  try{
    const ghCfg = await fetch('./config.json?t='+Date.now()).then(r=>r.json()).catch(()=>null);
    if(ghCfg && ghCfg.apiBase) API_BASE=ghCfg.apiBase;
  }catch(e){}
  const me = await api('/api/me');
  STATE = me;
  CATALOG = me.catalog || CATALOG;
  renderAll();
  if(qp.get('promo')) setTimeout(()=>{const el=document.getElementById('promoInp'); if(el){el.value=qp.get('promo');}},100);
}

function goTab(tab, sub){
  CUR_TAB = tab;
  if(sub) SHOP_SUB = sub;
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('active'));
  const nb = document.getElementById('nav-'+tab);
  if(nb) nb.classList.add('active');
  if(tab==='top' && !BOARD.length) loadLeaderboard();
  renderAll();
}

async function loadLeaderboard(){
  try{ const d=await api('/api/leaderboard'); BOARD=d.leaderboard||[]; renderAll(); }catch(e){}
}

async function toggleLang(){
  try{ STATE = await api('/api/lang','POST',{lang:lang()==='ru'?'en':'ru'}); renderAll(); }
  catch(e){toast(e.message)}
}

function renderTop(){
  if(!STATE || !CATALOG) return;
  const u=STATE.user;
  document.getElementById('balCrystals').textContent=u.crystals;
  document.getElementById('balSparks').textContent=u.sparks;
  document.getElementById('langBtn').textContent=lang().toUpperCase();
  document.getElementById('topName').textContent=u.first_name + (u.equipped_title && CATALOG.cosmetics[u.equipped_title] ? ' • '+CATALOG.cosmetics[u.equipped_title].badge : '');
  const pendingNfts = (STATE.nft_inventory||[]).filter(x=>x.status==='in_collection').length;
  document.getElementById('topSub').textContent=`⚡ ${u.power_score} CP · 🎨 NFT: ${pendingNfts} · 📖 ${u.unique_count}/35`;
  const ava=document.getElementById('topAva');
  ava.className='brand-ava'+(u.equipped_frame && CATALOG.cosmetics[u.equipped_frame] ? ' '+CATALOG.cosmetics[u.equipped_frame].css : '');
  const sc = u.showcase_item && CATALOG.items[u.showcase_item];
  ava.innerHTML = sc ? `<img src="${sc.image_url}" style="width:28px;height:28px;object-fit:contain">` : '✨';

function mountHeroLottie(lottieUrl, fallbackImg){
  const el=document.getElementById('heroLottie');
  if(!el) return;
  if(HERO_LOTTIE){try{HERO_LOTTIE.destroy()}catch(e){} HERO_LOTTIE=null;}
  if(lottieUrl && window.lottie){
    el.innerHTML='';
    try{
      HERO_LOTTIE = window.lottie.loadAnimation({container:el,renderer:'svg',loop:true,autoplay:true,path:lottieUrl});
      HERO_LOTTIE.addEventListener('data_failed',()=>{el.innerHTML=`<img src="${fallbackImg}" alt="">`;});
    }catch(e){ el.innerHTML=`<img src="${fallbackImg}" alt="">`; }
  } else {
    el.innerHTML=`<img src="${fallbackImg}" alt="">`;
  }
}

    const stTag = n.status==='in_collection' ? `<span class="tag tag-green">${t('Готов к выводу NFT','Ready to Claim')}</span>`
                : (n.status==='pending_transfer' ? `<span class="tag tag-gold">⏳ ${t('Передаётся (1–24ч)','Pending Transfer')}</span>`
                : `<span class="tag">✅ ${t('Отправлен','Transferred')}</span>`);
    return `<div class="nft-row">
      <div style="display:flex;align-items:center;gap:9px">
        <img src="${it?it.image_url:''}" style="width:46px;height:46px;object-fit:contain">
        <div>
          <div style="font-weight:900;font-size:13px">${esc(it?itemName(it):n.item_key)}</div>
          <div style="margin-top:3px">${stTag}</div>
        </div>
      </div>
      ${n.status==='in_collection' ? `<button class="btn btn-gold btn-sm" onclick="claimNft(${n.id})">📤 ${t('Забрать','Claim')}</button>` : ''}
    </div>`;
  }).join('') : `<div class="sub" style="color:var(--muted)">${t('Пока нет выигранных Telegram NFT. Крути баннеры — каждые 5–10 круток или в 100% NFT Сюрприз-Боксе падает реальный NFT!','No won Telegram NFTs yet — pull banners or open 100% NFT Box!')}</div>`;

  const owned=ownedMap();
  const msHtml=(CATALOG.milestones||[]).map(m=>{
    const done=u.milestones_claimed.includes(m.count);
    const can=!done && u.unique_count>=m.count;
    return `<div class="sday ${done?'done':(can?'next':'')}" style="padding:7px 4px;cursor:pointer" onclick="${can?`claimMilestone(${m.count})`:''}">
      <div>${m.count}/35</div><div style="font-size:8.5px">${done?'✅':`+${m.crystals}💎`}</div></div>`;
  }).join('');

  let list=Object.values(CATALOG.items);
  if(ALBUM_FILTER==='nft') list=list.filter(x=>x.is_nft);
  else if(ALBUM_FILTER==='card') list=list.filter(x=>!x.is_nft);
  else if(ALBUM_FILTER==='owned') list=list.filter(x=>!!owned[x.key]);
  else if(ALBUM_FILTER==='missing') list=list.filter(x=>!owned[x.key]);

  const cards=list.map(it=>{
    const ow=owned[it.key];
    return `<div class="item-card r${it.stars_rank} ${ow?'':'locked'}" onclick="openItemModal('${it.key}')">
      <div class="ic-top"><span>${it.is_nft?'🎨':starBadges(it.stars_rank)}</span>${ow?`<span class="c-badge">C${ow.constellation}</span>`:`<span>🔒</span>`}</div>
      <img src="${it.image_url}" alt="">
      <div class="ic-name">${esc(itemName(it))}</div>
      <div class="ic-pw">${ow?`⚡ ${ow.power} CP`:`+${it.base_power} CP`}</div>
    </div>`;
  }).join('');

  return `
    <div class="card" style="border-color:rgba(192,132,252,.45)">
      <div class="sec-h"><h3>🎨 ${t('Мои реальные Telegram NFT','My Real Telegram NFTs')} (${nfts.length})</h3><span class="tag">${t('Без обратного выкупа','Keep / Transfer')}</span></div>
      <div style="margin-bottom:10px">
        <div class="sub" style="margin-bottom:4px;color:var(--muted)">${t('TON-кошелёк для получения NFT (Tonkeeper / MyTonWallet / @wallet, формат UQ...):','Your TON receiving wallet (UQ... / EQ...):')}</div>
        <div style="display:flex;gap:7px">
          <input class="input" id="tonAddrInp" value="${esc(u.ton_wallet||'')}" placeholder="UQ...">
          <button class="btn btn-blue btn-sm" onclick="saveWallet()">${t('Сохранить','Save')}</button>
        </div>
      </div>
      ${nftListHtml}
    </div>

    <div class="card">
      <div class="sec-h"><h3>📖 ${t('Астральный Альбом','Astral Album')} (${u.unique_count}/35)</h3><span class="tag tag-gold">⚡ ${u.power_score} CP</span></div>
      <div class="streak-row" style="grid-template-columns:repeat(5,1fr)">${msHtml}</div>
    </div>
    <div class="filters">
      <button class="fbtn ${ALBUM_FILTER==='all'?'active':''}" onclick="ALBUM_FILTER='all';renderAll()">${t('Все 35','All 35')}</button>
      <button class="fbtn ${ALBUM_FILTER==='nft'?'active':''}" onclick="ALBUM_FILTER='nft';renderAll()">🎨 NFT (19)</button>
      <button class="fbtn ${ALBUM_FILTER==='card'?'active':''}" onclick="ALBUM_FILTER='card';renderAll()">✨ 3D (16)</button>
      <button class="fbtn ${ALBUM_FILTER==='owned'?'active':''}" onclick="ALBUM_FILTER='owned';renderAll()">${t('Открыты','Owned')}</button>
      <button class="fbtn ${ALBUM_FILTER==='missing'?'active':''}" onclick="ALBUM_FILTER='missing';renderAll()">${t('Нет','Missing')}</button>
    </div>
    <div class="album-grid">${cards}</div>`;
}

async function saveWallet(){
  const w=(document.getElementById('tonAddrInp')?.value||'').trim();
  try{ STATE=await api('/api/wallet/set','POST',{wallet:w}); toast(t('TON-кошелёк сохранён!','Wallet saved!')); renderAll(); }
  catch(e){toast(e.message)}
}
async function claimNft(invId){
  const w=(document.getElementById('tonAddrInp')?.value||'').trim();
  try{
    const res=await api('/api/nft/claim','POST',{inv_id:invId, wallet:w});
    STATE=res; renderAll();
    openModal(`<h3 style="margin:0 0 8px">🎨 ${res.claim_status==='transferred'?t('NFT отправлен!','NFT Sent!'):t('Заявка принята!','Transfer Queued')}</h3>
      <p style="font-size:13px;line-height:1.45">${esc(res.message)}</p>
      <button class="btn btn-gold" style="width:100%" onclick="closeModal()">OK</button>`);
  }catch(e){toast(e.message)}
}

function openItemModal(k){
  const it=CATALOG.items[k];
  const ow=ownedMap()[k];
  openModal(`
    <div style="text-align:center">
      <span class="tag ${it.stars_rank===5?'tag-gold':(it.stars_rank===4?'tag-epic':'')}">${it.is_nft?'REAL TELEGRAM NFT':'3D COLLECTIBLE'}</span>
      <h2 style="margin:8px 0 4px">${esc(itemName(it))}</h2>
      <div id="modalLottie" style="width:128px;height:128px;margin:4px auto;display:flex;align-items:center;justify-content:center"><img src="${it.image_url}" style="width:120px;height:120px;object-fit:contain"></div>
      <p style="font-size:12px;color:var(--muted)">${esc((lang()==='en'?it.lore_en:it.lore_ru)||'')}</p>
      <div class="card" style="background:#070b18;text-align:left;font-size:12px">
        <div>${t('Созвездие:','Constellation:')} <b>${ow?`C${ow.constellation}/6 (${ow.copies} шт.)`:'🔒 Не открыт'}</b></div>
        <div>${t('Мощь в Зале Славы:','Collection Power:')} <b>⚡ ${ow?ow.power:it.base_power} CP</b></div>
        <div>${t('Добыча Искр в Отряде:','Expedition Yield:')} <b>+${ow?ow.hourly_sparks:it.hourly_sparks} ✨/${t('час','hr')}</b></div>
      </div>
      ${ow?`<button class="btn btn-gold" style="width:100%;margin-bottom:8px" onclick="setShowcase('${k}')">⭐ ${t('На витрину профиля','Set Showcase')}</button>`:''}
      <button class="btn btn-ghost" style="width:100%" onclick="closeModal()">${t('Закрыть','Close')}</button>
    </div>`);
  if(it.lottie_url && window.lottie){
    const mEl=document.getElementById('modalLottie');
    if(mEl){
      mEl.innerHTML='';
      try{
        MODAL_LOTTIE=window.lottie.loadAnimation({container:mEl,renderer:'svg',loop:true,autoplay:true,path:it.lottie_url});
        MODAL_LOTTIE.addEventListener('data_failed',()=>{mEl.innerHTML=`<img src="${it.image_url}" style="width:120px;height:120px;object-fit:contain">`;});
      }catch(e){}
    }
  }
}
async function setShowcase(k){
  try{ const u=STATE.user; STATE=await api('/api/profile/equip','POST',{frame:u.equipped_frame,title:u.equipped_title,showcase_item:k}); closeModal(); toast(t('Витрина обновлена!','Showcase updated!')); renderAll(); }
  catch(e){toast(e.message)}
}
async function claimMilestone(cnt){
  try{ const r=await api('/api/milestones/claim','POST',{count:cnt}); STATE=r; toast(`+${r.reward.crystals} 💎 +${r.reward.sparks} ✨!`); renderAll(); }
  catch(e){toast(e.message)}
}

function renderShop(){
  const u=STATE.user;
  const subTabs=`
    <div class="btn-row" style="margin-bottom:10px">
      <button class="btn ${SHOP_SUB==='sparks'?'btn-epic':'btn-ghost'} btn-sm" onclick="SHOP_SUB='sparks';renderAll()">✨ ${t('Искры → 💎 Алмазы','Sparks → 💎')}</button>
      <button class="btn ${SHOP_SUB==='stars'?'btn-blue':'btn-ghost'} btn-sm" onclick="SHOP_SUB='stars';renderAll()">⭐ ${t('Магазин Звёзд','Stars Store')}</button>
    </div>`;

  if(SHOP_SUB==='sparks'){
    const boughtMap=STATE.spark_shop_bought||{};
    const cosOwned=new Set(STATE.cosmetics||[]);
    const offers=(CATALOG.spark_shop||[]).map(d=>{
      const q=boughtMap[d.key]||0;
      const isCos=d.kind==='cosmetic';
      const maxOut = isCos ? cosOwned.has(d.cosmetic_key) : (d.monthly_limit>0 && q>=d.monthly_limit);
      const limLbl = isCos ? (maxOut?t('Открыто','Owned'):t('Навсегда','Permanent')) : `${q}/${d.monthly_limit} ${t('в мес.','/mo')}`;
      return `<div class="shop-item">
        <div>
          <div style="font-weight:900;font-size:13px">${d.emoji} ${esc(lang()==='en'?d.title_en:d.title_ru)} <span class="tag" style="font-size:9px">${limLbl}</span></div>
          <div class="sub" style="color:var(--muted);margin-top:2px">${esc(lang()==='en'?d.desc_en:d.desc_ru)}</div>
        </div>
        <button class="btn ${maxOut?'btn-ghost':'btn-epic'} btn-sm" ${maxOut?'disabled':''} onclick="buySpark('${d.key}')">
          ${maxOut?'✅':`✨ ${d.cost_sparks}`}
        </button>
      </div>`;
    }).join('');
    return subTabs + `<div class="card"><div class="sec-h"><h3>✨ ${t('Обмен Искр на Алмазы 💎','Convert Sparks to 💎')}</h3><span class="tag tag-gold">✨ ${u.sparks}</span></div>${offers}</div>`;
  }

  const blessCard = u.blessing_days_left > 0
    ? `<div class="card" style="border-color:rgba(56,189,248,.5)"><div class="sec-h"><h3>🌙 ${t('Благословение активно:','Blessing Active:')} ${u.blessing_days_left} ${t('дн.','days')}</h3>
       ${u.can_claim_blessing ? `<button class="btn btn-blue btn-sm" onclick="claimBlessing()">${t('Забрать 90 💎','Claim 90 💎')}</button>` : `<span class="tag tag-green">✅ ${t('Сегодня забрано','Claimed today')}</span>`}</div></div>` : '';

  const packs=(CATALOG.packs||[]).map(p=>{
    const oneDone = p.one_time && u.starter_bought;
    const bpDone = p.is_bp && u.bp_premium;
    const disabled = oneDone || bpDone;
    const tag = lang()==='en'?p.tag_en:p.tag_ru;
    return `<div class="shop-item" style="${p.featured?'border-color:rgba(250,204,21,.4)':''}">
      <div>
        <div style="font-weight:900;font-size:13px">${esc(lang()==='en'?p.title_en:p.title_ru)} ${tag?`<span class="tag tag-gold" style="font-size:9px">${esc(tag)}</span>`:''}</div>
        <div class="sub" style="color:var(--muted);margin-top:2px">${esc(lang()==='en'?p.desc_en:p.desc_ru)}</div>
      </div>
      <button class="btn ${disabled?'btn-ghost':'btn-blue'} btn-sm" ${disabled?'disabled':''} onclick="buyPack('${p.key}')">${oneDone||bpDone?'✅':`⭐ ${p.stars}`}</button>
    </div>`;
  }).join('');

  return subTabs + blessCard + `<div class="card"><div class="sec-h"><h3>⭐ ${t('Алмазы Призыва и Пропуска','Diamonds & Passes')}</h3></div>${packs}
    <div style="font-size:10.5px;color:var(--muted);margin-top:6px">${t('Оплата через официальный Telegram Stars (XTR). Выигранные NFT можно забрать на личный TON-кошелёк без обратного выкупа.','Official Telegram Stars (XTR) digital packs.')}</div></div>`;
}

async function buySpark(key){
  try{ const r=await api('/api/spark_shop/buy','POST',{offer_key:key}); STATE=r; toast(t('Обмен выполнен!','Converted!')); renderAll(); }
  catch(e){toast(e.message)}
}
async function claimBlessing(){
  try{ const r=await api('/api/blessing/claim','POST',{}); STATE=r; toast('+90 💎!'); renderAll(); }catch(e){toast(e.message)}
}
async function buyPack(packKey){
  try{
    const r=await api('/api/invoice','POST',{pack_key:packKey});
    if(tg && tg.openInvoice){ tg.openInvoice(r.invoice_link, async (s)=>{ if(s==='paid'){ toast(t('Оплата прошла!','Paid!')); await loadAll(); } }); }
    else { window.open(r.invoice_link,'_blank'); }
  }catch(e){toast(e.message)}
}

function renderTopTab(){
  const u=STATE.user;
  const frames=(STATE.cosmetics||[]).filter(k=>CATALOG.cosmetics[k]?.kind==='frame');
  const titles=(STATE.cosmetics||[]).filter(k=>CATALOG.cosmetics[k]?.kind==='title');
  const frameSel=`<select class="input" id="eqFrame" onchange="applyCosmetics()" style="margin-bottom:6px"><option value="">${t('Без рамки','No frame')}</option>${frames.map(k=>`<option value="${k}" ${u.equipped_frame===k?'selected':''}>${esc(CATALOG.cosmetics[k].name_ru)}</option>`).join('')}</select>`;
  const titleSel=`<select class="input" id="eqTitle" onchange="applyCosmetics()"><option value="">${t('Без титула','No title')}</option>${titles.map(k=>`<option value="${k}" ${u.equipped_title===k?'selected':''}>${esc(CATALOG.cosmetics[k].name_ru)}</option>`).join('')}</select>`;
  const streakDays=(CATALOG.streak_rewards||[]).map(sr=>{
    const done=sr.day<=u.streak_day;
    const isNext=u.can_streak && sr.day===((u.streak_day%7)+1);
    return `<div class="sday ${done?'done':(isNext?'next':'')}"><div>Д${sr.day}</div><div>+${sr.crystals}💎</div></div>`;
  }).join('');
  const lbRows=(BOARD.length?BOARD:[]).map(r=>{
    const sc=r.showcase_item && CATALOG.items[r.showcase_item];
    return `<div class="lb-row">
      <div style="display:flex;align-items:center;gap:8px"><b style="width:22px;color:${r.rank<=3?'var(--gold)':'var(--muted)'}">#${r.rank}</b>
      ${sc?`<img src="${sc.image_url}" style="width:30px;height:30px;object-fit:contain">`:'✨'}
      <div><div style="font-weight:800;font-size:12px">${esc(r.display_name)} ${r.equipped_title&&CATALOG.cosmetics[r.equipped_title]?CATALOG.cosmetics[r.equipped_title].badge:''}</div>
      <div class="sub">📖 ${r.unique_count}/35 · C+${r.total_const}</div></div></div>
      <div style="font-weight:900;color:var(--gold);font-size:12px">⚡ ${r.power_score}</div></div>`;
  }).join('') || `<div class="sub">${t('Загрузка рейтинга...','Loading...')}</div>`;
  const ch=STATE.channel||{}; const gw=ch.giveaway;
  const shareUrl=`https://t.me/share/url?url=https://t.me/${CATALOG.bot_username}?start=ref_${u.user_id}&text=Собирай%20Telegram%20NFT%20в%20GiftBox!`;
  return `
    <div class="card">
      <div class="sec-h"><h3>👤 ${t('Профиль Коллекционера','Profile')}</h3><button class="btn btn-green btn-sm" onclick="shareInvite('${shareUrl}')">👥 ${t('Друг (+25✨/+80💎)','Invite')}</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">
        <div><div class="sub">${t('Рамка','Frame')}</div>${frameSel}</div>
        <div><div class="sub">${t('Титул','Title')}</div>${titleSel}</div>
      </div>
      <div class="btn-row">
        <button class="btn ${u.can_daily_12h?'btn-blue':'btn-ghost'} btn-sm" ${u.can_daily_12h?'':'disabled'} onclick="claimDaily12()">${u.can_daily_12h?'🎁 +40💎 +20✨ (12ч)':`⏳ ${fmtLeft(u.next_daily_in_sec)}`}</button>
        <button class="btn ${u.can_streak?'btn-gold':'btn-ghost'} btn-sm" ${u.can_streak?'':'disabled'} onclick="claimStreak()">${u.can_streak?`🔥 ${t('День #'+(u.streak_day%7+1),'Streak Day')}`:`✅ ${t('Серия:','Streak:')} ${u.streak_day}/7`}</button>
      </div>
      <div class="streak-row">${streakDays}</div>
    </div>
    ${ch.channel_id && ch.tma_enabled && !u.channel_sub_claimed ? `
      <div class="card" style="border-color:rgba(56,189,248,.45)"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div><div style="font-weight:900;font-size:13px">📢 ${esc(ch.channel_title||'GiftBox Live')}</div><div class="sub">+80 💎 +40 ✨</div></div>
        <div style="display:flex;gap:6px">${ch.channel_url?`<a class="btn btn-ghost btn-sm" href="${esc(ch.channel_url)}" target="_blank">${t('Канал','Join')}</a>`:''}<button class="btn btn-blue btn-sm" onclick="claimSub()">✅</button></div>
      </div></div>` : ''}
    ${gw ? `<div class="card" style="border-color:rgba(250,204,21,.45)"><div class="sec-h"><h3>🎉 ${t('Розыгрыш','Giveaway')} ${gw.prize_count}×${gw.crystals}💎</h3><span class="tag">${gw.participants}</span></div>
      <button class="btn ${gw.joined?'btn-ghost':'btn-gold'} btn-sm" style="width:100%" onclick="joinGw()">${gw.joined?`✅ ${t('Билетов:','Tickets:')} ${gw.my_tickets}`:`🎉 ${t('Участвовать','Join')}`}</button></div>` : ''}
    <div class="card"><div class="sec-h"><h3>🎟 ${t('Промокод','Promo Code')}</h3></div>
      <div style="display:flex;gap:7px"><input class="input" id="promoInp" placeholder="START45 / WISH120"><button class="btn btn-blue btn-sm" onclick="redeemPromo()">OK</button></div></div>
    <div class="card"><div class="sec-h"><h3>🏆 ${t('Зал Славы (CP)','Hall of Fame (CP)')}</h3><button class="btn btn-ghost btn-sm" onclick="loadLeaderboard()">🔄</button></div>${lbRows}</div>`;
}

function shareInvite(url){ if(tg&&tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url,'_blank'); }
async function applyCosmetics(){
  const frame=document.getElementById('eqFrame')?.value||''; const title=document.getElementById('eqTitle')?.value||'';
  try{ STATE=await api('/api/profile/equip','POST',{frame,title,showcase_item:STATE.user.showcase_item||''}); toast(t('Сохранено!','Saved!')); renderAll(); }catch(e){toast(e.message)}
}
async function claimDaily12(){ try{ STATE=await api('/api/daily','POST',{}); toast('+40 💎 +20 ✨!'); renderAll(); }catch(e){toast(e.message)} }
async function claimStreak(){ try{ const r=await api('/api/streak','POST',{}); STATE=r; toast(`+${r.reward.crystals} 💎!`); renderAll(); }catch(e){toast(e.message)} }
async function claimSub(){ try{ const r=await api('/api/claim_channel_sub','POST',{}); STATE=r; toast(`+${r.reward.crystals} 💎!`); renderAll(); }catch(e){toast(e.message)} }
async function joinGw(){ try{ const r=await api('/api/join_giveaway','POST',{}); STATE=r; toast(t('Участвуешь!','Joined!')); renderAll(); }catch(e){toast(e.message)} }
async function redeemPromo(){
  const code=(document.getElementById('promoInp')?.value||'').trim();
  if(!code) return;
  try{ const r=await api('/api/redeem_promo','POST',{code}); STATE=r; toast(`+${r.reward.crystals} 💎 +${r.reward.sparks} ✨!`); renderAll(); }catch(e){toast(e.message)}
}

function renderAll(){
  if(!STATE || !CATALOG) return;
  renderTop();
  const main=document.getElementById('main');
  if(CUR_TAB==='wishes') main.innerHTML=renderWishes();
  else if(CUR_TAB==='squad') main.innerHTML=renderSquad();
  else if(CUR_TAB==='nfts') main.innerHTML=renderNftsAndAlbum();
  else if(CUR_TAB==='shop') main.innerHTML=renderShop();
  else main.innerHTML=renderTopTab();
}

loadAll().catch(e=>{ document.getElementById('topSub').textContent='Ошибка: '+e.message; });
</script>
</body>
</html>
